#
# The security headers for veilvoice.conf. Copy to
# /etc/nginx/snippets/veilvoice-headers.conf.
#
# The scripts load only from this site. The one outside address they talk
# to is GitHub's API, for the live repository panel, and only when the
# reader presses its button. Styles need 'unsafe-inline' because pages set
# small per-element values (animation delays, colours) in style
# attributes, and the no-JavaScript edition keeps its stylesheet inline so
# it stays a single file. With no inline scripts allowed, an injected
# style cannot run code. The search box is the one form, and it submits to
# this site.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
# Two years. Add `; preload` only once you are sure every subdomain will
# always be HTTPS, because leaving the preload list takes months.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
