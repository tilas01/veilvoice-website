#
# nginx configuration for serving site/ from your own server.
#
# Written for a server behind Cloudflare: Cloudflare holds the public
# certificate and connects to this server over TLS with a Cloudflare origin
# certificate. Test the file with `nginx -t` before reloading nginx.
#
# Replace `your.domain` below with the site's domain (twice) and point `root`
# at the folder that holds a copy of site/.

# Anything that is not HTTPS is sent to HTTPS, and nothing else is served.
server {
    listen 80;
    listen [::]:80;
    server_name your.domain;
    server_tokens off;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain;

    root /srv/veilvoice-website/site;
    index index.html;
    charset utf-8;

    # The Cloudflare origin certificate and its key. Keep the key readable by
    # root only (chmod 600).
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # The site keeps no record of who visits: no access log at all, and errors
    # only from nginx itself, which never include a visitor's address at this
    # level.
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/veilvoice-error.log crit;

    # A static site has no use for anything but reading.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Security headers, sent with every response including errors. They live
    # in one file because nginx drops a server's add_header lines inside any
    # location that sets one of its own, so each such location includes the
    # file again.
    include /etc/nginx/snippets/veilvoice-headers.conf;

    # Pages are checked for changes on every visit; pictures, styles and
    # scripts can be kept for a day. A release replaces them all at once, so a
    # day-old copy is at worst one release behind.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/veilvoice-headers.conf;
    }

    location ~* \.(?:css|js|png|gif|svg|webp|ico|woff2|json|txt|asc)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/veilvoice-headers.conf;
    }

    # Nothing that starts with a dot is ever served (.git, .well-known aside).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    error_page 404 /404.html;
}
