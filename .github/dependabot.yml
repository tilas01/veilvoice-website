#
# Dependency monitoring for the VeilVoice website.
#
# The site is plain HTML, CSS and JavaScript with no package manager: its
# scripts use only what the browser provides, and the pages are generated by
# the tools in tilas01/veilvoice. So the one thing here that pulls in code from
# outside is GitHub Actions, and that is the only ecosystem watched.
#
# If the site ever gains a package.json, add an `npm` entry beside this one in
# the same commit.
#
# Nothing merges by itself. Each pull request waits for a person, and a bump is
# applied by hand in tilas01's name, the same way as in tilas01/veilvoice.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # A new release waits a few days before it is offered, so a compromised
    # version that is pulled quickly never reaches this repository.
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: "Actions"
    labels: [dependencies]
    open-pull-requests-limit: 5
