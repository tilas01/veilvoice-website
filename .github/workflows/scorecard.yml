# SPDX-License-Identifier: GPL-3.0-or-later
#
# The OpenSSF Scorecard: an outside check of how this repository is run
# (pinned actions, scoped tokens, branch rules, signed history), the same one
# tilas01/veilvoice runs.
#
# Results go to the Security tab and the public Scorecard API, which only
# accepts results from a workflow whose top-level token is read-only and whose
# job runs nothing but these steps.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `security-events` writes the findings to the Security tab. `id-token`
    # proves to the Scorecard API that this workflow produced the results.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
