# SPDX-License-Identifier: GPL-3.0-or-later
#
# Static analysis of everything in this repository that runs.
#
# Two things run here: the site's JavaScript in a visitor's browser, and these
# workflows, which hold the token that can write to this repository. Both are
# analysed as code rather than trusted as configuration.
#
# The security-extended query suite is used rather than the default. It adds
# the queries that trace untrusted input further, including the one that flags
# untrusted text reaching a prompt for an AI model, so a pull request that
# introduces a prompt injection route is caught in review.
#
# JavaScript is analysed from the commit that first adds the site's scripts;
# until then the repository has none, and CodeQL fails on a language with no
# source. That commit adds `javascript-typescript` to the matrix below.
#
# GitHub's default CodeQL setup must stay off in Settings, Code security, while
# this file exists: the two refuse to run side by side.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well, because the queries improve between CodeQL releases.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Writing findings to the Security tab is the only write this needs.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
